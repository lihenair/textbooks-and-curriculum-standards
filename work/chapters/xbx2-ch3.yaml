# 选必2 第三章 生态系统及其稳定性 —— 知识库唯一真相源
chapter_id: xbx2-ch3
subject: 生物
book: 人教版《生物学 选择性必修2 生物与环境》（2019）
book_short: bio-xbx2
chapter_no: 3
chapter_title: 生态系统及其稳定性
canon_file: references/nodes/biology.md
canon_chapter: 选择性必修2 第三章 生态系统及其稳定性
graph_doc: references/pep-bio-xbx2-ch3.md
entry_question: 先学哪个节点：生态系统的结构、能量流动，还是物质循环和信息传递？

sections:
  - title: 生态系统的结构
    nodes:
      - id: kp_ecosystem_structure
        display: 生态系统的结构
        aliases: [生产者, 消费者, 分解者, 食物链, 食物网]
        type: concept
        l1: 能阐明生态系统由生产者、消费者和分解者等生物因素以及阳光、空气、水等非生物因素组成，各组分紧密联系使生态系统成为具有一定结构和功能的统一体
        l2: 能讨论某一生态系统中生产者和消费者通过食物链和食物网联系在一起形成复杂的营养结构
        l3: 待补录：延伸不在本节点展开
        example: 自编归类题：绿色植物（生产者）、牛和兔（消费者）、蜣螂与细菌真菌（分解者）、阳光空气水（非生物的物质和能量）
        pitfall: 分解者能将动植物遗体和动物的排遗物分解成无机物——没有分解者，生态系统就无法维持
        confusion: 一种生物在食物网中可能占据多个营养级——分析时按其在每条食物链中所处的位置分别确定
        source: {textbook: "P46-52", curriculum: "2.2.1、2.2.2"}
  - title: 生态系统的能量流动
    nodes:
      - id: kp_energy_flow
        display: 生态系统的能量流动
        aliases: [能量流动, 营养级, 生态金字塔]
        type: concept
        l1: 能分析生态系统中的能量单向流动、逐级递减的规律，相邻营养级的传递效率大约为 10%~20%
        l2: 能解释生态金字塔表征了食物网各营养级之间在个体数量、生物量和能量方面的关系，并说明研究能量流动的实践意义
        l3: 待补录：延伸不在本节点展开
        example: 自编去向分析题：某营养级同化的能量 = 自身呼吸散失 + 流向下一营养级 + 流向分解者 +（未被利用）——能量不能循环利用
        pitfall: 能量流动的特点是单向流动、逐级递减——能量不能循环利用，因此生态系统需要不断输入能量
        confusion: 粪便中的能量不属于该营养级同化的能量——它属于上一营养级同化能量中流向分解者的部分
        source: {textbook: "P53-59", curriculum: "2.2.3、2.2.5"}
  - title: 生态系统的物质循环
    nodes:
      - id: kp_material_cycle
        display: 生态系统的物质循环
        aliases: [物质循环, 碳循环, 生物富集]
        type: concept
        l1: 能分析组成生物体的碳、氢、氧、氮等元素在生物群落与无机环境之间不断循环
        l2: 能举例说明某些有害物质会通过食物链不断地富集的现象
        l3: 待补录：延伸不在本节点展开
        example: 自编碳循环题：碳在生物群落与无机环境之间主要以 CO₂ 的形式循环，在生物群落内部以含碳有机物的形式传递
        pitfall: 物质循环具有全球性——物质循环的范围是整个生物圈，因此又叫生物地球化学循环
        confusion: 能量流动与物质循环同时进行、不可分割——物质是能量的载体，能量是物质循环的动力
        source: {textbook: "P60-64", curriculum: "2.2.3、2.2.6"}
  - title: 生态系统的信息传递
    nodes:
      - id: kp_information_transfer
        display: 生态系统的信息传递
        aliases: [物理信息, 化学信息, 行为信息]
        type: concept
        l1: 能举例说出生态系统中物理信息、化学信息和行为信息的传递
        l2: 能说明信息传递对生命活动的正常进行、生物种群的繁衍和种间关系的调节起着重要作用
        l3: 待补录：延伸不在本节点展开
        example: 自编归类题：蝙蝠的回声定位（物理信息）、昆虫的性外激素（化学信息）、蜜蜂的舞蹈（行为信息）
        pitfall: 信息传递往往是双向的——如狼与兔之间相互影响，区别于能量流动的单向性
        confusion: 信息传递可以调节种间关系、维持生态系统的稳定——信息传递发生在生物与生物、生物与无机环境之间
        source: {textbook: "P64-66", curriculum: 2.2.7}
  - title: 生态系统的稳定性
    nodes:
      - id: kp_ecosystem_stability
        display: 生态系统的稳定性
        aliases: [生态平衡, 抵抗力稳定性, 恢复力稳定性]
        type: concept
        l1: 能解释生态系统具有保持或恢复自身结构和功能相对稳定、并维持动态平衡的能力
        l2: 能举例说明生态系统的稳定性会受到自然或人为因素的影响，并说出提高生态系统稳定性的措施
        l3: 待补录：延伸不在本节点展开
        example: 自编分析题：草原适度放牧能保持稳定，过度放牧会破坏稳定性——生态系统的自我调节能力有一定限度
        pitfall: 生态系统的自我调节能力有一定限度——外来干扰超过这个限度，生态系统的稳定性就会遭到破坏
        confusion: 抵抗力稳定性与恢复力稳定性一般呈负相关——营养结构越复杂，抵抗力稳定性通常越强
        source: {textbook: "P66-75", curriculum: "2.3.1、2.3.2"}

