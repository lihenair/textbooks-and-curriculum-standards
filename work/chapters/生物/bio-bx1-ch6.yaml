entry_question: 先学哪个节点：细胞的增殖、细胞的分化，还是细胞的衰老和凋亡？

sections:
  - title: 细胞的增殖
    nodes:
      - id: kp_cell_cycle
        display: 细胞周期
        aliases: [分裂间期, 分裂期, 无丝分裂]
        type: concept
        l1: 能说出连续分裂的细胞从一次分裂完成时开始到下一次分裂完成时为止是一个细胞周期，包括分裂间期和分裂期
        l2: 能说出分裂间期进行 DNA 分子的复制和有关蛋白质的合成，为分裂期做准备；并能举例说出无丝分裂（如蛙的红细胞）
        l3: 待补录：延伸不在本节点展开
        example: 自编周期界定题：细胞周期从一次分裂完成时开始，到下一次分裂完成时为止——间期历时长，分裂期历时短（不同细胞的周期时长见教材表6-1）
        pitfall: 分裂间期进行 DNA 分子的复制和有关蛋白质的合成——时间最长、为分裂期做准备，间期不是“休息期”
        confusion: 无丝分裂的过程比较简单——细胞核先延长、中部向内凹陷缢裂成两个细胞核，再整个细胞缢裂（如蛙的红细胞）
        source: {textbook: "P110-112 含表6-1", curriculum: 2.3.1}
      - id: kp_mitosis
        display: 有丝分裂
        aliases: []
        type: concept
        l1: 能描述有丝分裂分裂期（前期、中期、后期、末期）中染色体和纺锤体的主要变化
        l2: 能阐明有丝分裂将亲代细胞的染色体经过复制后平均分配到两个子细胞，保证了遗传信息在亲代和子代细胞中的一致性
        l3: 待补录：延伸不在本节点展开
        example: 自编排序题：按染色体行为给四个时期排序——前期染色体散乱分布；中期染色体的着丝粒排列在细胞中央的平面上；后期着丝粒分裂、染色体移向两极；末期形成两个子细胞
        pitfall: 有丝分裂的重要意义是染色体复制后精确地平均分配——这是“保证遗传信息一致性”的关键表述
        confusion: 间期“复制”、分裂期“分配”——遗传信息一致性的实现分这两条主线理解
        source: {textbook: P110-117, curriculum: 2.3.1}
  - title: 细胞的分化
    nodes:
      - id: kp_cell_differentiation
        display: 细胞的分化
        aliases: [分化]
        type: concept
        l1: 能说明在个体发育过程中，细胞在形态、结构和功能方面发生特异性的分化，形成复杂的多细胞生物体
        l2: 能举例说出分化是普遍存在的——构成人体的四种组织分别是上皮组织、肌肉组织、结缔组织和神经组织
        l3: 待补录：延伸不在本节点展开
        example: 自编举例题：受精卵发育成人体后，细胞出现了上皮组织、肌肉组织、结缔组织和神经组织等多种类型——分化使细胞种类变多、功能变专
        pitfall: 分化的核心是形态、结构和功能发生特异性变化——只答“数量变多”是错的，数量变多属于增殖
        confusion: 增殖是“数量增加”，分化是“种类变多、功能变专”——两个过程同时发生但含义不同
        source: {textbook: P118-119, curriculum: 2.3.2}
      - id: kp_totipotency
        display: 细胞的全能性
        aliases: [全能性, 干细胞]
        type: concept
        l1: 能说出高度分化的植物细胞仍然具有发育成完整植株的能力，这就是细胞的全能性
        l2: 能举例说出动物和人体内保留着具有分裂和分化能力的干细胞，如能分化出红细胞、白细胞和血小板的造血干细胞
        l3: 待补录：延伸不在本节点展开
        example: 自编情境题：造血干细胞能分化出红细胞、白细胞和血小板——说明动物体内保留着有分裂和分化能力的干细胞
        pitfall: 全能性的判断标准是“发育成完整个体”——分化的细胞能长出完整植株才体现了全能性，只分化出某类细胞不算
        confusion: 干细胞保留正常的分裂和分化能力；癌细胞是不受控制地恶性增殖的细胞——两种“能分裂”的细胞性质完全不同
        source: {textbook: P118-122, curriculum: 2.3.2}
  - title: 细胞的衰老和死亡
    nodes:
      - id: kp_cell_aging
        display: 细胞的衰老
        aliases: [衰老, 自由基学说, 端粒学说]
        type: concept
        l1: 能描述在正常情况下，细胞衰老是一种自然的生理过程，并说出衰老细胞的主要特征
        l2: 能说出解释细胞衰老机制的两个学说——自由基学说和端粒学说
        l3: 待补录：延伸不在本节点展开
        example: 自编归类题：细胞内水分减少、多种酶活性降低、色素积累、呼吸速率减慢、细胞膜通透性改变——这些都是衰老细胞的特征
        pitfall: 细胞衰老是自然的生理过程，与个体衰老既有联系又有区别——多细胞生物体内总有部分细胞处于衰老或死亡状态
        confusion: 自由基学说从自由基攻击破坏生物分子入手；端粒学说从细胞分裂次数增加、端粒逐渐缩短入手——两个学说的着眼点不同
        source: {textbook: P123-126, curriculum: 2.3.3}
      - id: kp_cell_death
        display: 细胞凋亡
        aliases: [细胞坏死, 程序性死亡]
        type: concept
        l1: 能说出细胞凋亡是由基因所决定的细胞自动结束生命的过程；由于受到遗传机制决定的程序性调控，它是一种程序性死亡
        l2: 能从诱因、过程和结果等方面区分细胞凋亡与细胞坏死
        l3: 待补录：延伸不在本节点展开
        example: 自编区分题：蝌蚪发育过程中尾巴的消失属于细胞凋亡（基因决定）；割伤、烫伤造成的细胞死亡属于细胞坏死（不利因素影响）
        pitfall: 细胞凋亡是主动的、由基因决定的自动结束生命的过程；细胞坏死是在极端的物理、化学因素或严重的病理性刺激下的被动死亡
        confusion: 凋亡对生物体是有利的正常生理过程，坏死对生物体是有害的——“有利/有害”别答反
        source: {textbook: P126-127, curriculum: 2.3.3}

