entry_question: 先学哪个节点：细胞学说、生命系统的结构层次，还是细胞的多样性和统一性？

sections:
  - title: 细胞是生命活动的基本单位
    nodes:
      - id: kp_cell_theory
        display: 细胞学说
        aliases: [细胞学说的建立过程, 细胞学说内容]
        type: concept
        l1: 能说出细胞学说的要点：动植物都由细胞发育而来，细胞是独立的生命单位，新细胞来自老细胞的分裂
        l2: 能概述细胞学说建立过程中观察、归纳与修正的环节，并说明它揭示的是生物界的统一性
        l3: 待补录：延伸不在本节点展开
        example: 自编情境：魏尔肖用"细胞通过分裂产生新细胞"修正了施莱登关于新细胞来源的猜想，说明科学理论在修正中前进
        pitfall: 细胞学说揭示的是动植物的统一性，不是细胞的多样性；别把它和多样性结论混在一起
        confusion: 施莱登、施旺提出理论，魏尔肖是修正者——考"补充者"别答成前两位
        source: {textbook: P2-5, curriculum: 模块1概念1说明}
      - id: kp_life_system
        display: 生命系统的结构层次
        aliases: [结构层次, 生命系统]
        type: concept
        l1: 能列举从细胞、组织、器官、系统、个体到种群、群落、生态系统、生物圈的结构层次
        l2: 能举例说明生命活动离不开细胞，并用"细胞是基本的生命系统"解释多细胞生物的合作
        l3: 待补录：延伸不在本节点展开
        example: 自编排序题：心肌细胞→心肌组织→心脏→血液循环系统→大熊猫（个体）→种群→群落→生态系统
        pitfall: 植物没有"系统"这一层次——由器官直接构成个体；单细胞生物没有组织、器官层次；病毒没有细胞结构，不属于生命系统的任何层次
        confusion: 种群看"同种"、群落看"该区域所有生物"、生态系统再加上无机环境，三者范围逐层扩大
        source: {textbook: P5-7, curriculum: 模块1概念1}
  - title: 细胞的多样性和统一性
    nodes:
      - id: kp_microscope_use
        display: 高倍显微镜的使用
        aliases: [高倍镜, 显微镜使用, 显微镜操作]
        type: skill
        l1: 能按顺序说出高倍镜操作要点：低倍镜下找到并移中物像，转转换器换高倍镜，调亮视野，只调细准焦螺旋
        l2: 能用高倍镜观察不同种类的细胞，并描述它们在形态和结构上的差异
        l3: 待补录：延伸不在本节点展开
        example: 自编操作题：换高倍镜后视野变暗、物像模糊，应该先调光圈或反光镜，再只动细准焦螺旋
        pitfall: 换高倍镜后只能调细准焦螺旋，不能再动粗准焦螺旋
        confusion: 放大倍数变大，看到的细胞变大、数目变少、视野变暗——三个变化要连在一起说
        source: {textbook: P8-9, curriculum: 模块1教学提示·活动建议}
      - id: kp_prokaryote_eukaryote
        display: 原核细胞和真核细胞
        aliases: [原核细胞, 真核细胞, 原核生物, 真核生物]
        type: concept
        l1: 能描述两类细胞最大的区别是原核细胞没有以核膜为界限的细胞核，并举例说出蓝细菌和细菌属于原核生物
        l2: 能运用两类细胞在细胞核上的区别，判断常见生物（细菌、蓝细菌、酵母菌等）属于原核生物还是真核生物
        l3: 待补录：延伸不在本节点展开
        example: 自编判断：发菜、大肠杆菌、支原体、酵母菌各属于什么？（发菜、大肠杆菌、支原体都是原核生物，酵母菌是真核真菌）
        pitfall: 带“菌”字不一定是原核生物——酵母菌是真菌，属于真核生物；病毒没有细胞结构，两类都不属于
        confusion: 蓝细菌旧称"蓝藻"，名字带"藻"但是原核生物；它是自养的（含藻蓝素和叶绿素），别的多数细菌是异养
        source: {textbook: P10-12, curriculum: 模块1内容要求1.3.2}
      - id: kp_cell_diversity_unity
        display: 细胞的多样性和统一性
        aliases: [细胞多样性, 细胞统一性]
        type: concept
        l1: 能举例说出细胞的形态多种多样
        l2: 能说明多种多样的细胞共有细胞膜、细胞质和遗传物质集中区域，并据此解释细胞的统一性
        l3: 待补录：延伸不在本节点展开
        example: 自编对比：人的心肌细胞与蓝细菌细胞形态差异极大，但都有细胞膜和 DNA，这就是统一性的证据
        pitfall: 多样性说的是"不一样"，统一性说的是"都一样"的部分——答题时两边都要落到具体结构上
        confusion: 统一性由细胞学说"新细胞由老细胞分裂产生"来解释，不要答成"因为都由细胞构成"
        source: {textbook: P9-12, curriculum: 模块1内容要求1.3.1}

